function tags(x){let a=[];if(x.n)a.push('<span class="badge new">신규</span>');if(x.h)a.push('<span class="badge hidden">숨은 후보</span>');if(x.s)a.push('<span class="badge">'+esc(x.s)+'</span>');return a.join('')}
function row(x){let u=directUrl(x);return '<article class="row" onclick="this.classList.toggle(\'open\')"><div class="topline"><div class="badges">'+tags(x)+'</div><span class="muted">'+esc(x.noticeType)+'</span></div><div class="title">'+esc(x.title)+'</div><div class="agency">'+esc(x.a)+'</div><div class="meta"><div class="metaBox"><span>사업금액</span><strong>'+esc(x.b)+'</strong></div><div class="metaBox deadlineBox"><span>'+esc(x.deadlineType)+'</span><strong>'+esc(x.d)+'</strong></div></div><div class="summary">'+esc(x.why)+'</div><div class="detail"><div class="grid"><div class="cell"><span>공고번호</span>'+esc(x.noticeNo)+'</div><div class="cell"><span>적합도</span>'+esc(x.f)+'</div><div class="cell"><span>핵심 과업</span>'+esc(x.task)+'</div><div class="cell"><span>필수 자격 / 탈락조건</span>'+esc(x.q)+'</div><div class="cell"><span>공동수급</span>'+esc(x.j)+'</div></div><div class="actions" onclick="event.stopPropagation()">'+(u?'<a class="link" href="'+esc(u)+'" target="_blank" rel="noopener">나라장터 원문 열기 ↗</a>':'<span class="disabled">나라장터 공식 원문 URL 확인 중</span>')+'</div></div></article>'}
function deadlineValue(x){let m=String(x.d||'').match(/(20\d{2})\.(\d{2})\.(\d{2})(?:\s+(\d{2}):(\d{2}))?/);return m?new Date(+m[1],+m[2]-1,+m[3],+(m[4]||23),+(m[5]||59)).getTime():Number.MAX_SAFE_INTEGER}function fitValue(x){let f=String(x.f||'');return f.startsWith('매우 높음')?4:f.startsWith('높음')?3:f.startsWith('보통')?2:1}function soon(x){let v=deadlineValue(x);return Number.isFinite(v)&&v!==Number.MAX_SAFE_INTEGER&&v-Date.now()<=5*86400000&&v>=Date.now()}
function render(){let q=document.querySelector('#search').value.trim().toLowerCase();let a=D.filter(x=>{let ok=F==='all'||F==='active'&&x.t==='active'||F==='watch'&&x.t==='watch'||F==='new'&&x.n||F==='hidden'&&x.h||F==='high'&&/높음/.test(x.f)||F==='soon'&&soon(x);let txt=[x.title,x.a,x.why,x.task,x.q].join(' ').toLowerCase();return ok&&(!q||txt.includes(q))});let s=document.querySelector('#sort').value;if(s==='deadline')a.sort((x,y)=>deadlineValue(x)-deadlineValue(y));else if(s==='deadlineDesc')a.sort((x,y)=>deadlineValue(y)-deadlineValue(x));else if(s==='new')a.sort((x,y)=>(y.n||0)-(x.n||0)||deadlineValue(x)-deadlineValue(y));else if(s==='fit')a.sort((x,y)=>fitValue(y)-fitValue(x)||deadlineValue(x)-deadlineValue(y));document.querySelector('#list').innerHTML=a.map(row).join('')||'<p class="muted">조건에 맞는 공고가 없습니다.</p>';document.querySelector('#count').textContent=a.length+'건 표시'}
function stats(){document.querySelector('#stats').innerHTML=[['전체',D.length],['진행',D.filter(x=>x.t==='active').length],['신규',D.filter(x=>x.n).length],['Watch',D.filter(x=>x.t==='watch').length]].map(v=>'<div class="stat"><b>'+v[1]+'</b><span>'+v[0]+'</span></div>').join('')}
document.querySelectorAll('.filters button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filters button').forEach(z=>z.classList.remove('active'));b.classList.add('active');F=b.dataset.f;render()});document.querySelector('#search').oninput=render;document.querySelector('#sort').onchange=render;stats();render();
</script></body></html>
