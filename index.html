<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>페리굿 조달 레이더</title><style>
:root{--bg:#f6f8fc;--card:#fff;--text:#172033;--muted:#6b7280;--line:#e5e9f2;--blue:#2563eb;--green:#07864b;--orange:#d97706}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:1080px;margin:auto;padding:22px 14px 60px}header{display:flex;justify-content:space-between;align-items:end}.eyebrow{font-size:10px;font-weight:800;letter-spacing:.11em;color:var(--blue);margin:0 0 5px}h1{font-size:25px;margin:0;letter-spacing:-.04em}.muted{color:var(--muted);font-size:12px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:18px 0 12px}.stat{background:#fff;border:1px solid var(--line);border-radius:13px;padding:11px 13px}.stat b{font-size:20px;display:block}.stat span{font-size:11px;color:var(--muted)}.tools{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0 14px}.search{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:14px;outline:none}.filters{display:flex;gap:6px;overflow:auto;margin-top:9px;padding-bottom:2px}.filters button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 11px;font-weight:700;color:var(--muted);white-space:nowrap}.filters button.active{background:var(--text);color:#fff}.list{display:grid;gap:7px}.row{background:#fff;border:1px solid var(--line);border-radius:13px;padding:12px 13px;cursor:pointer}.rowtop{display:grid;grid-template-columns:55px 1fr 110px 100px 95px;gap:10px;align-items:center}.badges{display:flex;gap:4px;flex-wrap:wrap}.badge{font-size:10px;font-weight:800;padding:4px 6px;border-radius:999px;background:#eef2ff;color:#4338ca}.badge.hidden{background:#fff7ed;color:#c2410c}.badge.new{background:#ecfdf3;color:#067647}.title{font-size:14px;font-weight:800;line-height:1.35}.agency,.budget,.deadline{font-size:12px;color:var(--muted)}.budget b,.deadline b{font-size:10px;color:#7b8494;font-weight:700}.deadline{line-height:1.45}.deadline b{color:#dc2626}.budget{line-height:1.45}.fit{font-size:12px;font-weight:800;color:var(--green)}.summary{font-size:12px;color:#4b5563;margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.detail{display:none;border-top:1px solid var(--line);margin-top:10px;padding-top:10px}.row.open .detail{display:block}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.cell{background:var(--bg);border-radius:9px;padding:9px;font-size:12px}.cell span{display:block;color:var(--muted);font-size:10px;margin-bottom:3px}.actions{display:flex;gap:7px;margin-top:10px}.link,.disabled{font-size:12px;font-weight:800;padding:8px 10px;border-radius:8px;text-decoration:none}.link{background:var(--blue);color:#fff}.disabled{background:#eef0f4;color:#8a93a3}.sectiontitle{display:flex;justify-content:space-between;align-items:center;margin:16px 2px 8px}.sectiontitle h2{font-size:15px;margin:0}.count{font-size:11px;color:var(--muted)}footer{text-align:center;color:var(--muted);font-size:10px;margin-top:30px}
@media(max-width:650px){main{padding:17px 10px 45px}h1{font-size:22px}.stats{grid-template-columns:repeat(4,1fr);gap:5px}.stat{padding:9px 7px}.stat b{font-size:18px}.stat span{font-size:9px}.row{padding:10px}.rowtop{grid-template-columns:48px 1fr 66px;gap:6px}.agency{grid-column:2}.budget{grid-column:3;grid-row:2}.deadline{grid-column:3;grid-row:1}.title{font-size:13px}.summary{font-size:11px}.grid{grid-template-columns:1fr 1fr}.tools{padding:9px}.desktopfit{display:none}}
</style></head><body><main><header><div><p class="eyebrow">PELIGOOD · PROCUREMENT RADAR</p><h1>페리굿 조달 레이더</h1></div><p class="muted">업데이트 · 2026.09.19</p></header><section id="stats" class="stats"></section><section class="tools"><input id="search" class="search" placeholder="공고명, 기관, 과업, 키워드 검색"><div class="filters"><button class="active" data-f="all">전체</button><button data-f="active">진행</button><button data-f="new">신규</button><button data-f="hidden">숨은 후보</button><button data-f="watch">Watchlist</button><button data-f="high">적합도 높음+</button><button data-f="soon">마감임박</button></div></section><div class="sectiontitle"><h2>공고 목록</h2><span id="count" class="count"></span></div><section id="list" class="list"></section><footer>카드를 누르면 상세정보가 열립니다 · 원문 URL이 확인된 공고만 직접 링크 제공</footer></main><script>
const D=[{"r":1,"t":"active","s":"진행","n":0,"h":1,"title":"해양환경 이동교실 차량 내부 체험형 콘텐츠 제작 및 설치","a":"해양환경공단","b":"6,940만원","d":"9/28 10:00","f":"매우 높음","why":"이동형 체험공간 + 체험 콘텐츠 + 하드웨어 제작·설치 결합.","task":"차량 내부 체험형 콘텐츠 제작·설치 및 장비 연동","q":"SW사업자·직접생산확인 등 최종 확인 필요","j":"공동이행 가능"},{"r":2,"t":"watch","s":"사전규격","n":1,"h":1,"title":"26년 대화경찰 현장 중심 시뮬레이션 교육","a":"경찰청","b":"2,000만원","d":"의견 9/22","f":"매우 높음 후보","why":"현장 상황 시뮬레이션 교육. VR/HMD 적용 여부 추가 확인 필요.","task":"현장 중심 시뮬레이션 교육","q":"본공고 조건 확인 필요","j":"확인 필요"},{"r":3,"t":"active","s":"진행","n":0,"h":0,"title":"XR 용접훈련을 위한 교육용 XR 토치 개발","a":"울산대학교","b":"1,499만원","d":"9/28","f":"높음","why":"직무훈련 XR + 실제 토치 인터랙션.","task":"교육용 XR 토치 및 훈련 인터랙션 개발","q":"HW 요구사양 확인 필요","j":"불가"},{"r":4,"t":"watch","s":"본공고 대기","n":0,"h":1,"title":"정보보호 교육 시뮬레이션 개발","a":"한국로봇융합연구원","b":"9,900만원","d":"본공고 대기","f":"높음","why":"실습형 교육 시뮬레이션·다중사용자 환경.","task":"교육 시뮬레이션 개발","q":"보안·개발 자격 확인 필요","j":"확인 필요"},{"r":5,"t":"watch","s":"발주예정","n":0,"h":1,"title":"ACC 겨울 시즌 체험형 경관 콘텐츠 제작·운영","a":"국립아시아문화전당재단","b":"2억 990만원","d":"9월 발주 예정","f":"높음","why":"체험형 공간 콘텐츠로 인터랙티브·몰입형 적용 가능.","task":"체험형 경관 콘텐츠 제작·운영","q":"본 RFP 확인 필요","j":"확인 필요"}];let F='all';
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function directUrl(x){let u=x.url||x.u||'';return u&&u!=='https://www.g2b.go.kr/'?u:''}
function tags(x){let a=[];if(x.n)a.push('<span class="badge new">신규</span>');if(x.h)a.push('<span class="badge hidden">숨은</span>');a.push('<span class="badge">'+esc(x.s)+'</span>');return a.join('')}
function row(x){let u=directUrl(x);return '<article class="row" onclick="this.classList.toggle(\'open\')"><div class="rowtop"><div class="badges">'+tags(x)+'</div><div><div class="title">'+esc(x.title)+'</div><div class="agency">'+esc(x.a)+'</div></div><div class="deadline">'+esc(x.d)+'</div><div class="budget">'+esc(x.b)+'</div><div class="fit desktopfit">'+esc(x.f)+'</div></div><div class="summary">'+esc(x.why)+'</div><div class="detail"><div class="grid"><div class="cell"><span>적합도</span>'+esc(x.f)+'</div><div class="cell"><span>핵심 과업</span>'+esc(x.task)+'</div><div class="cell"><span>필수 자격</span>'+esc(x.q)+'</div><div class="cell"><span>공동수급</span>'+esc(x.j)+'</div></div><div class="actions" onclick="event.stopPropagation()">'+(u?'<a class="link" href="'+esc(u)+'" target="_blank" rel="noopener">공고 원문 바로가기 ↗</a>':'<span class="disabled">직접 원문 링크 확인 중</span>')+'</div></div></article>'}
function soon(x){return /9\/2[0-3]|마감임박/.test(x.d||'')}
function render(){let q=document.querySelector('#search').value.trim().toLowerCase();let a=D.filter(x=>{let ok=F==='all'||F==='active'&&x.t==='active'||F==='watch'&&x.t==='watch'||F==='new'&&x.n||F==='hidden'&&x.h||F==='high'&&/높음/.test(x.f)||F==='soon'&&soon(x);let txt=[x.title,x.a,x.why,x.task,x.q].join(' ').toLowerCase();return ok&&(!q||txt.includes(q))});document.querySelector('#list').innerHTML=a.map(row).join('')||'<p class="muted">조건에 맞는 공고가 없습니다.</p>';document.querySelector('#count').textContent=a.length+'건 표시'}
function stats(){document.querySelector('#stats').innerHTML=[['전체',D.length],['진행',D.filter(x=>x.t==='active').length],['신규',D.filter(x=>x.n).length],['Watch',D.filter(x=>x.t==='watch').length]].map(v=>'<div class="stat"><b>'+v[1]+'</b><span>'+v[0]+'</span></div>').join('')}
document.querySelectorAll('.filters button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filters button').forEach(z=>z.classList.remove('active'));b.classList.add('active');F=b.dataset.f;render()});document.querySelector('#search').oninput=render;stats();render();
</script></body></html>
