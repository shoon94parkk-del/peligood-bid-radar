function deadlineValue(x){let m=String(x.d||'').match(/(20\d{2})\.(\d{2})\.(\d{2})(?:\s+(\d{2}):(\d{2}))?/);return m?new Date(+m[1],+m[2]-1,+m[3],+(m[4]||23),+(m[5]||59)).getTime():Number.MAX_SAFE_INTEGER}
function fitValue(x){let f=String(x.f||'');return f.startsWith('매우 높음')?4:f.startsWith('높음')?3:f.startsWith('보통')?2:1}
function soon(x){let v=deadlineValue(x);return Number.isFinite(v)&&v!==Number.MAX_SAFE_INTEGER&&v-Date.now()<=5*86400000&&v>=Date.now()}
function render(){let q=document.querySelector('#search').value.trim().toLowerCase();let a=D.filter(x=>{let ok=F==='all'||F==='active'&&x.t==='active'||F==='watch'&&x.t==='watch'||F==='new'&&x.n||F==='hidden'&&x.h||F==='high'&&/높음/.test(x.f)||F==='soon'&&soon(x);let txt=[x.title,x.a,x.why,x.task,x.q,x.source,x.noticeNo].join(' ').toLowerCase();return ok&&(!q||txt.includes(q))});let s=document.querySelector('#sort').value;if(s==='deadline')a.sort((x,y)=>deadlineValue(x)-deadlineValue(y));else if(s==='deadlineDesc')a.sort((x,y)=>deadlineValue(y)-deadlineValue(x));else if(s==='new')a.sort((x,y)=>(y.n||0)-(x.n||0)||deadlineValue(x)-deadlineValue(y));else if(s==='fit')a.sort((x,y)=>fitValue(y)-fitValue(x)||deadlineValue(x)-deadlineValue(y));document.querySelector('#list').innerHTML=a.map(row).join('')||'<p class="muted">조건에 맞는 공고가 없습니다.</p>';document.querySelector('#count').textContent=a.length+'건 표시'}
